  <link rel="manifest" href="manifest.webmanifest" />

       scrapers do not resolve relative paths. Replace the placeholder origin

  <meta property="og:site_name" content="Ease My Life" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Ease My Life",
    "url": "https://easemylife.app/",
    "description": "Pick what to do today, without deciding. Ease My Life builds a short daily list for you from your own pickers, on your own schedule, entirely on your device.",

      "Weighted, random, and self-adjusting item pickers",

    ]

  <!-- Boot splash: equation resolving into the easing checkmark. Pure CSS so it
       paints immediately. Babel is gone in the Vite build, so this now only
       covers the module fetch + storage init — keep it short or drop it. -->
  <style>
    #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .42s ease}
    #boot-splash.bl-hide{opacity:0;pointer-events:none}
    #boot-splash .bl{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:clamp(24px,6vw,34px);font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;padding:0 20px}
    #boot-splash .tk{white-space:nowrap}
    #boot-splash .op,#boot-splash .eq{color:var(--muted)}
    #boot-splash sup{font-size:.62em;color:var(--text)}
    #boot-splash .chk{width:1.15em;height:1.15em;display:inline-flex}
    #boot-splash .chk svg{width:100%;height:100%}
    #boot-splash .chk path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    /* Pure-CSS looping stagger, compositor-driven so it stays smooth while the
       module graph loads. Each token is offset by --i, and the offset persists
       across loops (animation-delay only shifts the first iteration). */
    #boot-splash .tk{opacity:0;animation:bootTok 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
    #boot-splash .chk{animation:bootTok 3.4s ease-in-out infinite,bootPop 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
    @keyframes bootTok{0%{opacity:0;transform:translateX(-7px)}7%{opacity:1;transform:none}82%{opacity:1;transform:none}90%{opacity:0}100%{opacity:0}}
    @keyframes bootPop{0%,4%{transform:scale(.5)}10%{transform:scale(1.16)}16%,82%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){#boot-splash .tk,#boot-splash .chk{animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-label="Loading">
    <div class="bl"><span class="tk op" style="--i:0">(</span><span class="tk" style="--i:1">7</span><span class="tk op" style="--i:2">×</span><span class="tk" style="--i:3">3</span><span class="tk op" style="--i:4">)</span><span class="tk op" style="--i:5">−</span><span class="tk" style="--i:6">√9</span><span class="tk op" style="--i:7">+</span><span class="tk" style="--i:8">2<sup>2</sup></span><span class="tk eq" style="--i:9">=</span><span class="tk chk" style="--i:10"><svg viewBox="0 0 26 26"><path d="M5 13 l5 5 l11 -12"/></svg></span></div>
  </div>
  <script>
    (function(){
      var el=document.getElementById('boot-splash'); if(!el) return;
      var dismissed=false;
      // The splash must never vanish mid-assembly. Two conditions gate the
      // fade: the app has booted, AND the equation has finished assembling.
      // "Assembled" = the last token (the checkmark, --i:10) has appeared and
      // its pop has settled: delay (--i * .12s) + 16% of the 3.4s loop ≈ 1.74s.
      // Deliberately NOT the checkmark's full animationiteration (4.6s) — each
      // loop holds the finished equation static from 7% to 82%, so waiting for
      // a whole iteration would sit on ~2.8s of dead hold and read as two
      // cycles. Derived from the CSS below rather than hard-coded so retiming
      // the loop keeps this in sync.
      var TOK_STAGGER=0.12, LOOP=3.4, POP_SETTLED=0.16, LAST_I=10;
      var ASSEMBLED_MS=(LAST_I*TOK_STAGGER + LOOP*POP_SETTLED)*1000;
      var booted=false, cycled=false;
      // Pure-CSS animation; JS only fades it out once the app mounts — the
      // .42s opacity transition smooths whatever frame the loop is on.
      function hide(){ if(dismissed) return; dismissed=true; el.classList.add('bl-hide'); setTimeout(function(){ el.remove(); }, 460); }
      function maybeHide(){ if(booted && cycled) hide(); }
      // Reduced motion renders the equation already assembled, so there is
      // nothing to wait for.
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches){
        cycled=true;
      } else {
        setTimeout(function(){ cycled=true; maybeHide(); }, ASSEMBLED_MS);
      }
      window.__dismissBootSplash=function(){ booted=true; maybeHide(); };
      // Safety net: never trap the user if boot never signals.
      setTimeout(hide, 6000);
    })();
  </script>
  <noscript>
    <div style="max-width:38rem;margin:12vh auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6;color:#1c2230">
      <h1 style="font-size:1.6rem;letter-spacing:-0.02em">Ease My Life</h1>
      <p><strong>Pick what to do today, without deciding.</strong> Ease My Life builds a short
      daily list for you. You set up pickers &mdash; a group of items like chores, meals, or
      things you keep meaning to read &mdash; and the app chooses from them on the schedule you
      choose, so you open it to a handful of decisions already made.</p>
      <p>Pickers can choose at random, by weight, or adjust themselves over time so neglected
      items surface more often and recently-done ones rest. Add reminders for the things that
      genuinely repeat, and day-off conditionals for when life gets in the way.</p>
      <p>No account, no cloud, no nagging: everything is stored on your own device, and the app
      can be installed to your home screen and used offline.</p>
      <p><strong>JavaScript is required to use the app.</strong> Please enable it and reload
      this page.</p>
    </div>
  </noscript>
  <div id="root"></div>



    <!-- Netlify Forms detection stub. Netlify finds forms by parsing the BUILT
       HTML at deploy time — it never runs the app, so the React form in
       tab-settings.jsx is invisible to it. This static copy is what registers
       the form and its fields; the app then POSTs to '/' with a matching
       form-name. Keep the name and every field name in sync with the keys in
       ContactSupportCard's send(), or submissions are rejected. hidden keeps it
       out of the page; Netlify still parses it. -->
  <form name="support" netlify netlify-honeypot="bot-field" hidden>
    <label for="support-subject">Subject</label>
    <input type="text" name="subject" id="support-subject" />
    <label for="support-message">Message</label>
    <textarea name="message" id="support-message"></textarea>
    <label for="support-version">App version</label>
    <input type="text" name="version" id="support-version" />
    <label for="support-browser">Browser</label>
    <input type="text" name="browser" id="support-browser" />
    <label for="support-bot-field">Leave this field blank</label>
    <input type="text" name="bot-field" id="support-bot-field" />
  </form>



  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
